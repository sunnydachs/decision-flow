# decision-flow 既定設定。
# ローカル上書きは config/local.toml(git-ignored)に置くと deep-merge される。

[run]
concurrency = 4             # 全方式で共通の並列数(実行条件を統一する)
timeout_seconds = 30        # 全方式共通のクライアント timeout(公式推奨: Perplexity 30s)
max_retries = 3             # 指数バックオフの最大リトライ回数(Retry-After を尊重)
backoff_base_seconds = 1.0
backoff_max_seconds = 20.0
seed = 20261004             # データ順・シャッフルの決定的 seed
record_timestamp = true     # 全リクエストに実行日時(UTC ISO)を記録

[data]
root = "data"
# real データを外部 API に送るには --confirm-external が必要
external_data_class = "real"

[evaluation]
risk_label = "urgent_claim"     # 高リスク判定に使うラベル
risk_severity = "high"          # 高リスクの severity 値
recall_target = 0.95            # 高リスク recall の安全制約(calib で閾値決定)
bootstrap_samples = 1000
bootstrap_alpha = 0.05
calibration_bins = 10
stability_subset = 50           # 安定性テストのサブセット件数
stability_n = 20                # 同一入力の繰り返し回数(1日で完結するよう調整する)

[free_tier]
# mercury が使う共有無料枠(評価対象モデル側)。上限値は環境ごとに調整する。
daily_limit = 1000
per_minute_limit = 20
# 尽きたら停止せず、無料枠非依存の作業(ローカル/有料/指標/テスト)を先に進める
stop_on_exhaustion = false

[budget]
# 推定コスト(usage のトークン数 × 単価)。実請求額ではない。
perplexity_usd = 0.5
jev_usd = 1.0
confirm_external_required = true

[models.llm]
# 比較用 LLM。2モード(prompt / json_schema 強制)を必ず用意する。
# 任意の OpenAI 互換エンドポイントで差し替え可能(provider / endpoint / key_env で経路を指定)。
# モデルID・エンドポイント・キー名は環境ごとに config/local.toml(git-ignored)で上書きする。
# レポートには「この LLM についての結論であり、より大きなモデルには当てはまらない」と明記する。
provider = "openai-compatible"
model = ""               # 環境ごとに config/local.toml で設定する(README の「設定」を参照)
endpoint = ""            # 同上
key_env = "LLM_API_KEY"
tier = "external_free"   # 外部APIだが mercury 用の共有無料枠カウンタを消費しない
max_tokens = 1500        # 短い JSON 出力。切り詰めによる parse 失敗を防ぐ
alternatives = []

[models.mercury]
# 評価対象の Decision Model。モデルID・エンドポイント・キー名は
# config/local.toml(git-ignored)で設定する(評価対象の公式ドキュメントを参照)。
model = ""               # 環境ごとに config/local.toml で設定する
endpoint = ""            # 同上
key_env = "DECIDER_API_KEY"
key_status_endpoint = "" # 共有無料枠の残量確認エンドポイント(未設定なら確認をスキップ)
tier = "free"

[models.pplx_decider]
model = "pplx-decider-v1-27b"
endpoint = "https://api.perplexity.ai/v1/decisions"
tier = "paid"
price_input_usd_per_mtok = 0.04   # 公式: 入力 $0.04 / 100万トークン、出力無料

[models.jev]
provider = "typesafe"
model = "jev-1.13.0"              # バージョン固定(jev-latest は使わない)
endpoint = "https://api.typesafe.ai/v1/systemone"
tier = "paid"
price_input_usd_per_mtok = 0.042  # 公式: 入力 $42/Btok = $0.042/100万トークン
require_allow_paid_models = true

[data_generation]
# 評価データ(日本語問い合わせ)の生成に使うモデル。
# 評価対象(mercury / pplx-decider / jev / 比較用LLM)とは別系統のモデルを環境ごとに選ぶこと。
# モデルID・エンドポイント・キー名は config/local.toml(git-ignored)で設定する(README の「設定」を参照)。
provider = "openai-compatible"
endpoint = ""            # 環境ごとに config/local.toml で設定する
key_env = "LLM_API_KEY"
model = ""               # 同上
fallback_models = []     # 予備(連続失敗時に降格)
urgent_ratio = 0.32          # urgent_claim(severity=high)の目標比率
# 実測: 要求 0.27→21.7〜23.2%、0.30→23.6〜24.3%、0.34→calib34%/test30.4%(生成側のぶれが大きい)。
max_tokens = 8000
temperature = 1.0
timeout_seconds = 300
extra_body = {}
# 生成は calib と test を別実行で行う(同じデータで較正と評価をしない)。

[embedding]
# ローカル実行(外部送信なし)。既定はプレフィックス規約が不要な多言語モデル。
# 代替: intfloat/multilingual-e5-large(高精度だが大きい。採用時は query:/passage: の
#       プレフィックス規約を先に確認すること)。intfloat/multilingual-e5-small は fastembed 非対応。
backend = "fastembed"
model = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
query_prefix = ""
passage_prefix = ""
