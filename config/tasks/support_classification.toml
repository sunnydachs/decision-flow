# タスク定義: 問い合わせメールの分類(日本語)。
# カテゴリと説明はコードから分離し、全方式が同一の定義を使う。

id = "support_classification"
language = "ja"
risk_label = "urgent_claim"   # 見逃しコストが高いカテゴリ(高リスク判定に使う)

# 全方式で共通のタスク指示(LLM の prompt モードで使用)
instruction = """あなたはカスタマーサポートの受信箱を仕分けする担当者です。次の問い合わせ文を、以下のカテゴリのうち最も適切な 1 つに分類してください。

- urgent_claim: 即時対応が必要な緊急のクレーム。サービス障害、データ消失、不正アクセス、決済停止、個人情報の漏えいなど、放置すると重大な損害につながるもの。
- billing: 請求・支払い・返金・請求書の発行/宛名・契約の更新や解約に関する問い合わせ。
- technical: 不具合・エラー・設定・使い方など、製品やシステムの技術的な問い合わせ。
- sales: 見積もり・プラン変更・導入相談・パートナー制度など、営業に関する問い合わせ。
- other: 上記のいずれにも当てはまらないもの(採用・取材・スパム・その他)。

回答はカテゴリ名のみを 1 つ返してください。"""

# Decision Model(選択式)用の質問文。全方式で同じカテゴリ定義を渡すため、ここに日本語で固定する。
choice_instruction = """この問い合わせ文が、次のどのカテゴリに最も当てはまるかを 1 つ選んでください。
urgent_claim: 即時対応が必要な緊急のクレーム(サービス障害、データ消失、不正アクセス、決済停止、個人情報の漏えいなど)。
billing: 請求・支払い・返金・請求書(発行/宛名)・契約の更新や解約に関する問い合わせ。
technical: 不具合・エラー・設定・使い方など、製品やシステムの技術的な問い合わせ。
sales: 見積もり・プラン変更・導入相談・パートナー制度など、営業に関する問い合わせ。
other: 上記のいずれにも当てはまらないもの(採用・取材・スパム・その他)。"""

