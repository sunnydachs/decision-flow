# キーワードルール方式のパターン(ルールベースのベースライン)。
# 優先順位は上から。最初に一致したラベルを採用する。
# 注意: この初期セットはタスク定義から手で起こしたもの。Step 3 で calib のみを使って調整する
#       (test データは調整に使わない)。

fallback_label = "other"

[[rules]]
label = "urgent_claim"
patterns = [
  "至急", "緊急", "今すぐ", "直ちに", "即時", "早急", "本日中に", "今日中に",
  "ダウン", "障害", "止まって", "停止して", "復旧", "漏えい", "漏洩", "流出",
  "不正アクセス", "売上が止ま", "業務が止ま", "アカウントをロック", "公開してしまいました",
]

[[rules]]
label = "billing"
patterns = [
  "請求", "支払", "支払い", "返金", "領収書", "入金", "振込", "口座", "二重に引き落と",
  "引き落と", "決済", "インボイス", "宛名", "日割り", "請求書",
]

[[rules]]
label = "technical"
patterns = [
  "ログイン", "エラー", "不具合", "動きません", "表示され", "届きません", "届かなく",
  "更新され", "設定", "通知", "認証", "パスワード", "CSV", "API", "Webhook", "グラフ",
]

[[rules]]
label = "sales"
patterns = [
  "見積", "プラン", "導入", "トライアル", "パートナー", "再販", "デモ", "契約更新",
  "解約", "縮小", "拡張",
]

[[rules]]
label = "other"
patterns = ["採用", "応募", "取材", "プレス", "メルマガ", "配信を停止", "退会", "オフィス", "住所"]
