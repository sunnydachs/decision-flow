name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.11" の範囲内で、セキュリティ修正が継続している行だけ。
        # scripts/check_runtimes.py がこの行がEOLになったら失敗させる。
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]

    steps:
    - uses: actions/checkout@v7

    - name: Check the matrix versions are still supported
      run: python3 scripts/check_runtimes.py

    - name: Use Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install
      run: pip install -e ".[dev,figures,jev]"

    - name: Run tests
      run: python -m pytest -q
