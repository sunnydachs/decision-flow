name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm install
    - name: Run tests
      run: npm test
    # Optional: Codecov upload. Requires CODECOV_TOKEN in repo secrets.
    - name: Generate coverage (Node 20.x only)
      if: matrix.node-version == '20.x'
      run: npx --yes c8 --reporter=text-lcov --reporter=text node tests/scoring.test.mjs && node tests/integration.test.mjs
    - name: Upload coverage to Codecov (Node 20.x only)
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/lcov.info
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
