[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-flow"
version = "0.1.0"
description = "Decision-layer PoC: Rule / LLM / Decision Model / Hybrid evaluated on identical data and metrics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
# dev: CI と評価スクリプトの既定依存(軽量)
dev = [
  "pytest>=8.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]
# embed: ローカル埋め込み(fastembed は onnxruntime を伴うため任意)
embed = [
  "fastembed>=0.4",
]
# jev: TypeSafe 公式 SDK(Jev 実行時のみ)
jev = [
  "typesafe-sdk>=0.7",
]
# figures: 記事用の図の生成(matplotlib は重いので任意。seaborn は tvhahn 流儀の A/B 比較でのみ使用)
figures = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: requires external network / API keys (deselected by default)",
  "embed: requires the optional fastembed backend",
]
